[package]
name = "dialer"
version = "0.1.0"
edition = "2021"

[lib]
name = "dialer"
path = "src/lib.rs"

[[bin]]
name = "dialer_worker"
path = "src/bin/dialer_worker.rs"

[dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
