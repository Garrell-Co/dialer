version: '3.8'

services:
  freeswitch:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SIGNALWIRE_TOKEN: ${SIGNALWIRE_TOKEN:-}
    network_mode: "host"
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./conf:/etc/freeswitch
      - ./data:/var/log/freeswitch
      # - ./sounds:/usr/share/freeswitch/sounds
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
