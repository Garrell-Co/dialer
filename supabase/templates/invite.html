<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>You have been invited</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background-color: #f4f4f5;
        margin: 0;
        padding: 32px 16px;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        padding: 32px 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }

      h1 {
        font-size: 22px;
        margin: 0 0 12px;
        color: #020617;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: #4b5563;
        margin: 0 0 16px;
      }

      .button {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 999px;
        background-color: #6366f1;
        color: #ffffff !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0 8px;
      }

      .muted {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're invited</h1>
      <p>
        You've been invited to join our app with the email address
        <strong>{{ .Email }}</strong>.
      </p>
      <p>
        <a
          class="button"
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next={{ .RedirectTo }}"
          >Accept invitation</a
        >
      </p>
      <p class="muted">
        If you weren't expecting this invitation, you can safely ignore this
        email.
      </p>
    </div>
  </body>
</html>
