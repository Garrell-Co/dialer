<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Confirm reauthentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background-color: #f4f4f5;
        margin: 0;
        padding: 32px 16px;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        padding: 32px 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      }

      h1 {
        font-size: 22px;
        margin: 0 0 12px;
        color: #020617;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: #4b5563;
        margin: 0 0 16px;
      }

      .code {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 8px;
        background-color: #0f172a;
        color: #f9fafb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        letter-spacing: 0.18em;
        font-size: 16px;
      }

      .muted {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Confirm reauthentication</h1>
      <p>
        Use the code below to confirm it's really you before continuing this
        sensitive action.
      </p>
      <p>
        <span class="code">{{ .Token }}</span>
      </p>
      <p class="muted">
        This code will expire shortly. If you did not try to perform this
        action, you can ignore this email.
      </p>
    </div>
  </body>
</html>
